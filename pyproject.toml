[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fable-ai"
version = "0.1.0"
description = "AI-powered automation toolkit powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["automation", "rpa", "ai", "claude", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business",
]
dependencies = [
    "anthropic>=0.30.0",
    "pyautogui>=0.9.54",
    "playwright>=1.44.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
fable = "fable.cli:main"

[project.urls]
Homepage = "https://github.com/gatouche/fable-"
